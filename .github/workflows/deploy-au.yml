name: Deploy AU broker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hubspot-proxy-australia-demo
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Syntax and contract tests
        run: |
          npm run check
          node --check scripts/deploy-au.mjs
          node --check scripts/smoke-au.mjs
          npm test
      - name: Require a merged PR with Claude approval on this exact source tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy-au.mjs verify-review

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: australia-demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: 975774911479.dkr.ecr.ap-southeast-2.amazonaws.com/springmath-au-hubspot-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Assume the broker-only AU deployment role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::975774911479:role/hubspot-proxy-github-deploy-au
          aws-region: ap-southeast-2
          role-session-name: hubspot-proxy-${{ github.run_id }}
      - name: Verify the assumed AWS account before accessing ECR or EKS
        shell: bash
        run: |
          broker_aws_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$broker_aws_account" != '975774911479' ]]; then
            echo 'Refusing deployment: unexpected AWS account.' >&2
            exit 1
          fi
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish the reviewed ARM64 image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Unique tags allow secret-only redeploys with immutable ECR tags.
          tags: ${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0
      - name: Configure EKS access
        run: aws eks update-kubeconfig --region ap-southeast-2 --name springmath-au
      - name: Apply secrets and namespace-scoped resources
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          BROKER_TOKEN_SHA256: ${{ secrets.BROKER_TOKEN_SHA256 }}
          IMAGE_DIGEST: ${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: node scripts/deploy-au.mjs
      - name: Read-only public TLS and authentication-boundary smoke test
        run: node scripts/smoke-au.mjs
      - name: Record deployment identity
        env:
          IMAGE_DIGEST: ${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          printf 'AU broker deployed at https://hubspotproxy.springmath.au\n\nCommit: %s\n\nImage: %s\n\nNo ticket mutations or customer emails were exercised.\n' "$GITHUB_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
