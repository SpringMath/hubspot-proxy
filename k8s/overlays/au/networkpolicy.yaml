apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hubspot-proxy
  namespace: hubspot-proxy-demo
spec:
  # This overlay deliberately replaces the private demo client selector.
  # Approved callers use the authenticated TLS endpoint through Traefik.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - protocol: TCP
          port: 8080
